name: Build and Archive

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.2.0

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Stage built bundle at root
        run: mv dist/app-universal.iife.js app.js

      - name: Upload build bundle (sources + built artifact)
        uses: actions/upload-artifact@v4
        with:
          name: e-iam-site-build-${{ github.ref_name }}
          path: |
            src/**
            public/**
            r/**
            vite-config/**
            vite.config.js
            tailwind.config.js
            postcss.config.js
            package.json
            package-lock.json
            index.html
            app.js
